<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="darkreader-lock">
    <meta name="color-scheme" content="dark light">
    <title>Corrupted Hunllef Simulator</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- ===== Top HUD (always visible) ===== -->
    <header class="hud" aria-label="Top HUD">
      <div class="hud-left">
        <div class="hud-stat"><strong>Tick:</strong> <span id="tick">0</span></div>
      </div>
      <div class="hud-right">
        <button id="startBtn" class="hud-btn" type="button">Start</button>
        <button id="resetBtn" class="hud-btn" type="button">Reset</button>
      </div>
    </header>
    <button id="settingsTabHandle"
        class="settings-tab-handle"
        type="button"
        aria-controls="settingsSidebar"
        aria-expanded="false"
        aria-label="Open settings">
      ☰
    </button>
    <!-- ===== Left settings sidebar (collapsible) ===== -->
    <aside id="settingsSidebar" class="settings-sidebar" aria-label="Settings sidebar">
      <div class="settings-scroll">
        <section class="settings-section" aria-label="Health settings">
          <h3>Health</h3>
          <div id="settingsHealth" class="settings-group"></div>
        </section>
        <section class="settings-section" aria-label="Accessibility settings">
          <h3>Accessibility</h3>
          <div id="settingsAccessibility" class="settings-group"></div>
        </section>
        <section class="settings-section">
          <h3>Custom Keybinds</h3>
          <div id="settingsKeybinds" class="settings-group"></div>
        </section>
        <section class="settings-section" aria-label="Tile indicator settings">
          <h3>Tile Indicators</h3>
          <div id="settingsIndicators" class="settings-group"></div>
        </section>
      </div>
    </aside>
    <canvas id="game"></canvas>
    <!-- ===== Side panel (bottom-right): Tabs (Prayer / Inventory) ===== -->
    <div id="sidePanel" class="side-panel" aria-label="Side panel">
      <div class="side-tabs" role="tablist" aria-label="Side panel tabs">
        <button id="tabInventory" class="side-tab" type="button" role="tab" aria-selected="false">
          Inventory
        </button>
        <button id="tabPrayer" class="side-tab active" type="button" role="tab" aria-selected="true">
          Prayer
        </button>
      </div>
      <div class="side-content">
        <!-- Prayer tab view -->
        <div id="prayerTab" class="tab-view prayer-ui" aria-label="Prayer tab">
          <button id="prayRange" class="prayer-btn" type="button" aria-label="Protect from Missiles"></button>
          <button id="prayMage" class="prayer-btn" type="button" aria-label="Protect from Magic"></button>
        </div>
        <!-- Inventory tab view -->
        <div id="inventoryTab" class="tab-view inventory-ui is-hidden" aria-label="Inventory tab">
          <div id="invGrid" class="inv-grid" aria-label="Inventory grid"></div>
        </div>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
