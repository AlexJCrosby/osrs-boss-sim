<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="darkreader-lock">
    <meta name="color-scheme" content="dark light">
    <title>Corrupted Hunllef Simulator</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:," />
  </head>
  <body>
    <header class="hud">
      <div><strong>Tick:</strong> <span id="tick">0</span></div>
      <div><strong>Target:</strong> <span id="target">none</span></div>
      <div><strong>Status:</strong> <span id="status">Lobby</span></div>
      <button id="startBtn" type="button">Start</button>

      <button id="resetBtn" type="button">Reset</button>
    </header>
    <canvas id="game"></canvas>

    <!-- ===== Prayer UI (bottom-right) ===== -->
    <div id="prayerUI" class="prayer-ui" aria-label="Prayer tab">
      <button id="prayRange" class="prayer-btn" type="button" aria-label="Protect from Missiles"></button>
      <button id="prayMage" class="prayer-btn" type="button" aria-label="Protect from Magic"></button>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
